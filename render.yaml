# Render Blueprint: one Docker web service (Go API + Expo web app on the same
# origin). The database is Neon Postgres. Create it from the Render dashboard:
# New → Blueprint → this repository. Render asks for DATABASE_URL (the Neon
# connection string) and OPENAI_API_KEY there; neither is stored in the repo.
services:
  - type: web
    name: fluentpath
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      # Neon's direct (non-pooled) connection string, with sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: alloy
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: AI_DAILY_TOKENS_PER_USER
        value: "150000"
