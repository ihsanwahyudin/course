# Render Blueprint: one Docker web service (Go API + Expo web app on the same
# origin) and a managed Postgres. Create it from the Render dashboard:
# New → Blueprint → this repository. Render asks for OPENAI_API_KEY there;
# it is never stored in the repo.
services:
  - type: web
    name: fluentpath
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fluentpath-db
          property: connectionString
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: alloy
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: AI_DAILY_TOKENS_PER_USER
        value: "150000"

databases:
  - name: fluentpath-db
    databaseName: fluentpath
    user: fluentpath
    plan: basic-256mb
    region: singapore
